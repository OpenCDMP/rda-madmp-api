cache:
  manager:
    fallbackToNoOpCache: true
    caffeineCaches:
      - names: [ apikey ]
        allowNullValues: true
        initialCapacity: 100
        maximumSize: 500
        enableRecordStats: false
        expireAfterWriteSeconds: 600
      - names: [ tenantByCode ]
        allowNullValues: true
        initialCapacity: 100
        maximumSize: 500
        enableRecordStats: false
        expireAfterWriteSeconds: 20
      - names: [ tenantById ]
        allowNullValues: true
        initialCapacity: 100
        maximumSize: 500
        enableRecordStats: false
        expireAfterWriteSeconds: 20
      - names: [ userBySubjectId ]
        allowNullValues: true
        initialCapacity: 100
        maximumSize: 500
        enableRecordStats: false
        expireAfterWriteSeconds: 20
      - names: [ userAccessTenant ]
        allowNullValues: true
        initialCapacity: 100
        maximumSize: 500
        enableRecordStats: false
        expireAfterWriteSeconds: 20
      - names: [ "affiliation" ]
        allowNullValues: true
        initialCapacity: 100
        maximumSize: 5000
        enableRecordStats: false
        expireAfterWriteSeconds: 20
    mapCaches:
  apiKey:
    name: apikey
    keyPattern: ant_resolve_$keyhash$:v0
  userBySubjectId:
    name: userBySubjectId
    keyPattern: ant_user_by_subject_$subject$:v0
  tenantByCode:
    name: tenantByCode
    keyPattern: ant_tenant_by_code_$code$:v0
  tenantById:
    name: tenantById
    keyPattern: ant_tenant_by_id_$tenantId$:v0
  userAllowedTenant:
    name: userAccessTenant
    keyPattern: ant_user_access_tenant_$user_id$_$tenant_id$:v0
  affiliation:
    name: affiliation
    keyPattern: ant_affiliation_$entity$_$user$_$type$:v0
