web:
  security:
    enabled: true
    authorized-endpoints: [ dmps ]
    allowed-endpoints: [ "actuator", "dmps", "v3/api-docs", "swagger-ui" ]
    idp:
      api-key:
        enabled: false
      resource:
        token-type: JWT #| opaque
        jwt:
          claims: [ role, x-role ]
          issuer-uri: ${IDP_ISSUER_URI}
          audiences:
            - ${SECURITY_AUDIENCE}
          validIssuer: ${IDP_ISSUER_URI}